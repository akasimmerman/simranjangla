<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<title>Jewel Cascade — Match-3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Exo+2:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a14;
    --panel: #12122a;
    --accent: #7b5cff;
    --gold: #ffd700;
    --text: #e8e8ff;
    --muted: #8a8ab5;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Exo 2', system-ui, sans-serif;
    color: var(--text);
    touch-action: manipulation;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse at 20% 20%, #1a1040 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #0d1a3a 0%, transparent 50%),
      var(--bg);
  }

  #app {
    width: min(96vw, 480px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: linear-gradient(135deg, #1a1a3a, #12122a);
    border: 1px solid #2a2a55;
    border-radius: 16px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.05);
  }
  .brand {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1.5px;
    background: linear-gradient(90deg, #ffd700, #ff9f43, #7b5cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .stats {
    display: flex;
    gap: 16px;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
  }
  .stat { text-align: center; }
  .stat label { display: block; font-size: 9px; color: var(--muted); letter-spacing: 1px; margin-bottom: 2px; }
  .stat span { font-weight: 700; color: var(--gold); }

  #board-wrap {
    position: relative;
    aspect-ratio: 1;
    background: #0d0d1f;
    border-radius: 18px;
    border: 2px solid #2a2a55;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5), inset 0 0 60px rgba(123,92,255,0.08);
    overflow: hidden;
  }
  #board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: 100%;
    height: 100%;
    padding: 6px;
    gap: 4px;
  }

  .tile {
    position: relative;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(18px, 5.5vw, 28px);
    user-select: none;
    will-change: transform;
  }
  .tile::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(145deg, rgba(255,255,255,0.25), transparent 50%, rgba(0,0,0,0.15));
    pointer-events: none;
  }
  .tile.selected {
    transform: scale(1.12);
    box-shadow: 0 0 0 3px #fff, 0 0 20px rgba(255,255,255,0.5);
    z-index: 5;
  }
  .tile.matched {
    animation: pop 0.35s ease-out forwards;
  }
  .tile.falling {
    transition: transform 0.28s cubic-bezier(0.34, 1.2, 0.64, 1);
  }
  .tile.new {
    animation: dropIn 0.35s cubic-bezier(0.34, 1.2, 0.64, 1) both;
  }

  @keyframes pop {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.3); opacity: 0.8; }
    100% { transform: scale(0); opacity: 0; }
  }
  @keyframes dropIn {
    from { transform: translateY(-120%) scale(0.6); opacity: 0; }
    to { transform: translateY(0) scale(1); opacity: 1; }
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }

  /* Gem colors */
  .c0 { background: linear-gradient(145deg, #ff6b6b, #c0392b); box-shadow: 0 4px 12px rgba(192,57,43,0.4); }
  .c1 { background: linear-gradient(145deg, #54a0ff, #2e86de); box-shadow: 0 4px 12px rgba(46,134,222,0.4); }
  .c2 { background: linear-gradient(145deg, #1dd1a1, #10ac84); box-shadow: 0 4px 12px rgba(16,172,132,0.4); }
  .c3 { background: linear-gradient(145deg, #feca57, #ff9f43); box-shadow: 0 4px 12px rgba(255,159,67,0.4); }
  .c4 { background: linear-gradient(145deg, #a55eea, #8854d0); box-shadow: 0 4px 12px rgba(136,84,208,0.4); }
  .c5 { background: linear-gradient(145deg, #48dbfb, #0abde3); box-shadow: 0 4px 12px rgba(10,189,227,0.4); }

  .combo-banner {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(28px, 8vw, 42px);
    color: var(--gold);
    text-shadow: 0 0 30px rgba(255,215,0,0.8), 0 4px 0 #8a6d00;
    pointer-events: none;
    z-index: 20;
    transition: transform 0.25s cubic-bezier(0.34, 1.4, 0.64, 1);
  }
  .combo-banner.show { transform: translate(-50%, -50%) scale(1); }

  /* Overlays */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(8,8,20,0.88);
    backdrop-filter: blur(8px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    z-index: 30;
    border-radius: 18px;
    text-align: center;
    padding: 24px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(26px, 7vw, 36px);
    background: linear-gradient(90deg, #ffd700, #ff9f43, #7b5cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }
  .overlay p { color: var(--muted); font-size: 14px; max-width: 300px; line-height: 1.5; }
  .overlay .big-score {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    color: var(--gold);
  }
  .btn {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1px;
    padding: 14px 36px;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    background: linear-gradient(135deg, #7b5cff, #5a3fd4);
    color: white;
    box-shadow: 0 6px 0 #3d2a9e, 0 8px 24px rgba(123,92,255,0.4);
    transition: transform 0.08s, box-shadow 0.08s;
  }
  .btn:active {
    transform: translateY(4px);
    box-shadow: 0 2px 0 #3d2a9e, 0 4px 12px rgba(123,92,255,0.3);
  }
  .btn.secondary {
    background: linear-gradient(135deg, #2a2a55, #1a1a3a);
    box-shadow: 0 6px 0 #0d0d1f, 0 8px 20px rgba(0,0,0,0.3);
  }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    opacity: 0.7;
  }

  /* Particle canvas */
  #particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 15;
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand">JEWEL CASCADE</div>
    <div class="stats">
      <div class="stat"><label>SCORE</label><span id="score">0</span></div>
      <div class="stat"><label>MOVES</label><span id="moves">30</span></div>
      <div class="stat"><label>BEST</label><span id="best">0</span></div>
    </div>
  </header>

  <div id="board-wrap">
    <div id="board"></div>
    <canvas id="particles"></canvas>
    <div class="combo-banner" id="comboBanner"></div>

    <div class="overlay" id="startOverlay">
      <h1>JEWEL<br>CASCADE</h1>
      <p>Match 3 or more jewels of the same color. Cascades score higher. You have 30 moves — aim for the stars!</p>
      <button class="btn" id="startBtn">▶ PLAY</button>
    </div>

    <div class="overlay hidden" id="overOverlay">
      <h1 id="overTitle">GAME OVER</h1>
      <div class="big-score" id="finalScore">Score: 0</div>
      <p id="overMsg">Nice try!</p>
      <button class="btn" id="retryBtn">↻ PLAY AGAIN</button>
    </div>
  </div>

  <footer>Tap a jewel, then an adjacent one to swap · Built with ❤️ for simranjangla.com</footer>
</div>

<script>
const SIZE = 8;
const COLORS = 6;
const EMOJIS = ['💎','🔷','💚','🔶','💜','💠'];
const MOVES_START = 30;

const boardEl = document.getElementById('board');
const scoreEl = document.getElementById('score');
const movesEl = document.getElementById('moves');
const bestEl = document.getElementById('best');
const startOverlay = document.getElementById('startOverlay');
const overOverlay = document.getElementById('overOverlay');
const comboBanner = document.getElementById('comboBanner');
const particlesCanvas = document.getElementById('particles');
const pctx = particlesCanvas.getContext('2d');

let board = [];
let selected = null;
let score = 0;
let moves = MOVES_START;
let combo = 0;
let busy = false;
let highScore = 0;
let particles = [];
let animId = null;

try { highScore = parseInt(localStorage.getItem('jewelCascadeBest') || '0', 10) || 0; } catch(e){}
bestEl.textContent = highScore;

function resizeParticles() {
  const rect = document.getElementById('board-wrap').getBoundingClientRect();
  particlesCanvas.width = rect.width * (window.devicePixelRatio || 1);
  particlesCanvas.height = rect.height * (window.devicePixelRatio || 1);
  pctx.setTransform(window.devicePixelRatio || 1, 0, 0, window.devicePixelRatio || 1, 0, 0);
}
window.addEventListener('resize', resizeParticles);

function createBoard() {
  board = Array.from({length: SIZE}, () =>
    Array.from({length: SIZE}, () => Math.floor(Math.random() * COLORS))
  );
  // Remove initial matches
  let safety = 0;
  while (findMatches().length && safety++ < 40) {
    findMatches().forEach(([r,c]) => board[r][c] = Math.floor(Math.random() * COLORS));
  }
}

function renderBoard(animateNew = false) {
  boardEl.innerHTML = '';
  for (let r = 0; r < SIZE; r++) {
    for (let c = 0; c < SIZE; c++) {
      const tile = document.createElement('div');
      tile.className = `tile c${board[r][c]}`;
      if (animateNew) tile.classList.add('new');
      tile.dataset.r = r;
      tile.dataset.c = c;
      tile.textContent = EMOJIS[board[r][c]];
      tile.addEventListener('click', () => onTileClick(r, c));
      boardEl.appendChild(tile);
    }
  }
}

function getTileEl(r, c) {
  return boardEl.querySelector(`[data-r="${r}"][data-c="${c}"]`);
}

function onTileClick(r, c) {
  if (busy || moves <= 0) return;
  const tile = getTileEl(r, c);
  if (!selected) {
    selected = {r, c};
    tile.classList.add('selected');
    return;
  }
  if (selected.r === r && selected.c === c) {
    tile.classList.remove('selected');
    selected = null;
    return;
  }
  const dist = Math.abs(selected.r - r) + Math.abs(selected.c - c);
  if (dist !== 1) {
    getTileEl(selected.r, selected.c)?.classList.remove('selected');
    selected = {r, c};
    tile.classList.add('selected');
    return;
  }
  // Swap
  getTileEl(selected.r, selected.c)?.classList.remove('selected');
  swapAndResolve(selected.r, selected.c, r, c);
  selected = null;
}

async function swapAndResolve(r1, c1, r2, c2) {
  busy = true;
  // Visual swap
  const t1 = getTileEl(r1, c1);
  const t2 = getTileEl(r2, c2);
  const rect1 = t1.getBoundingClientRect();
  const rect2 = t2.getBoundingClientRect();
  const dx = rect2.left - rect1.left;
  const dy = rect2.top - rect1.top;
  t1.style.transition = 'transform 0.2s ease';
  t2.style.transition = 'transform 0.2s ease';
  t1.style.transform = `translate(${dx}px, ${dy}px)`;
  t2.style.transform = `translate(${-dx}px, ${-dy}px)`;
  await sleep(200);

  // Data swap
  [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
  renderBoard();

  const matches = findMatches();
  if (!matches.length) {
    // Revert
    [board[r1][c1], board[r2][c2]] = [board[r2][c2], board[r1][c1]];
    renderBoard();
    playTone(180, 0.08, 'sawtooth');
    busy = false;
    return;
  }

  moves--;
  movesEl.textContent = moves;
  combo = 0;
  await resolveCascades();
  if (moves <= 0) endGame();
  else busy = false;
}

function findMatches() {
  const matched = new Set();
  // Horizontal
  for (let r = 0; r < SIZE; r++) {
    let run = 1;
    for (let c = 1; c <= SIZE; c++) {
      if (c < SIZE && board[r][c] === board[r][c-1]) run++;
      else {
        if (run >= 3) for (let k = 0; k < run; k++) matched.add(`${r},${c-1-k}`);
        run = 1;
      }
    }
  }
  // Vertical
  for (let c = 0; c < SIZE; c++) {
    let run = 1;
    for (let r = 1; r <= SIZE; r++) {
      if (r < SIZE && board[r][c] === board[r-1][c]) run++;
      else {
        if (run >= 3) for (let k = 0; k < run; k++) matched.add(`${r-1-k},${c}`);
        run = 1;
      }
    }
  }
  return Array.from(matched).map(s => s.split(',').map(Number));
}

async function resolveCascades() {
  while (true) {
    const matches = findMatches();
    if (!matches.length) break;
    combo++;
    const points = matches.length * 10 * combo;
    score += points;
    scoreEl.textContent = score;
    showCombo(combo, points);
    playTone(320 + combo * 60, 0.1, 'sine');

    // Particles + pop
    matches.forEach(([r, c]) => {
      const el = getTileEl(r, c);
      if (el) {
        el.classList.add('matched');
        const rect = el.getBoundingClientRect();
        const wrap = document.getElementById('board-wrap').getBoundingClientRect();
        spawnParticles(rect.left - wrap.left + rect.width/2, rect.top - wrap.top + rect.height/2, board[r][c]);
      }
    });
    await sleep(320);

    // Clear
    matches.forEach(([r, c]) => board[r][c] = -1);

    // Drop
    for (let c = 0; c < SIZE; c++) {
      let write = SIZE - 1;
      for (let r = SIZE - 1; r >= 0; r--) {
        if (board[r][c] !== -1) {
          board[write][c] = board[r][c];
          write--;
        }
      }
      while (write >= 0) {
        board[write][c] = Math.floor(Math.random() * COLORS);
        write--;
      }
    }
    renderBoard(true);
    await sleep(360);
  }
}

function showCombo(n, pts) {
  if (n < 2) return;
  comboBanner.textContent = n >= 5 ? `🔥 x${n}!` : `x${n} COMBO`;
  comboBanner.classList.add('show');
  setTimeout(() => comboBanner.classList.remove('show'), 700);
}

function spawnParticles(x, y, colorIdx) {
  const colors = ['#ff6b6b','#54a0ff','#1dd1a1','#feca57','#a55eea','#48dbfb'];
  for (let i = 0; i < 12; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 40 + Math.random() * 80;
    particles.push({
      x, y,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 30,
      life: 0.5 + Math.random() * 0.3,
      max: 0.8,
      color: colors[colorIdx],
      size: 3 + Math.random() * 4
    });
  }
}

function updateParticles(dt) {
  const wrap = document.getElementById('board-wrap');
  if (!wrap) return;
  const w = wrap.clientWidth, h = wrap.clientHeight;
  pctx.clearRect(0, 0, w, h);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) { particles.splice(i, 1); continue; }
    p.vy += 180 * dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const a = p.life / p.max;
    pctx.globalAlpha = a;
    pctx.fillStyle = p.color;
    pctx.beginPath();
    pctx.arc(p.x, p.y, p.size * a, 0, Math.PI * 2);
    pctx.fill();
  }
  pctx.globalAlpha = 1;
}

function particleLoop(now) {
  if (!particleLoop.last) particleLoop.last = now;
  const dt = Math.min((now - particleLoop.last) / 1000, 0.05);
  particleLoop.last = now;
  updateParticles(dt);
  animId = requestAnimationFrame(particleLoop);
}

function playTone(freq, dur, type = 'sine') {
  try {
    const ctx = playTone.ctx || (playTone.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

function startGame() {
  createBoard();
  renderBoard();
  score = 0;
  moves = MOVES_START;
  scoreEl.textContent = '0';
  movesEl.textContent = moves;
  startOverlay.classList.add('hidden');
  overOverlay.classList.add('hidden');
  busy = false;
  selected = null;
  resizeParticles();
  if (!animId) animId = requestAnimationFrame(particleLoop);
}

function endGame() {
  busy = true;
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('jewelCascadeBest', String(highScore)); } catch(e){}
    bestEl.textContent = highScore;
  }
  document.getElementById('finalScore').textContent = `Score: ${score}`;
  document.getElementById('overTitle').textContent = score >= 800 ? 'LEGENDARY!' : score >= 400 ? 'GREAT RUN!' : 'GAME OVER';
  document.getElementById('overMsg').textContent = score > highScore ? 'New high score! 🏆' : 'Can you beat your best?';
  overOverlay.classList.remove('hidden');
  playTone(220, 0.3, 'triangle');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('retryBtn').addEventListener('click', startGame);

// Init empty board for visual
createBoard();
renderBoard();
resizeParticles();
</script>
</body>
</html>
