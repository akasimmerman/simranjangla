<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Space Shooter</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
    }
    body {
      background: #0a0a12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: #e0e0ff;
      user-select: none;
      -webkit-user-select: none;
    }
    h1 {
      font-size: clamp(1.1rem, 4vw, 1.6rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
      background: linear-gradient(90deg, #7af, #f7a, #7af);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      flex-shrink: 0;
    }
    #ui {
      display: flex;
      gap: clamp(1rem, 5vw, 2rem);
      margin-bottom: 0.4rem;
      font-size: clamp(0.9rem, 3.5vw, 1.1rem);
      font-variant-numeric: tabular-nums;
      flex-shrink: 0;
    }
    #ui span {
      color: #8cf;
    }
    #game-wrap {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 100vw;
      min-height: 0;
    }
    canvas {
      background: #050508;
      border: 2px solid #334;
      border-radius: 4px;
      box-shadow: 0 0 40px rgba(80, 120, 255, 0.15);
      display: block;
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      cursor: none;
      touch-action: none;
    }
    #overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      pointer-events: none;
      z-index: 10;
      padding: 0 1rem;
      width: 90%;
      max-width: 360px;
    }
    #overlay h2 {
      font-size: clamp(1.6rem, 7vw, 2.4rem);
      margin-bottom: 0.6rem;
      text-shadow: 0 0 20px #58f;
    }
    #overlay p {
      font-size: clamp(0.9rem, 3.5vw, 1.1rem);
      opacity: 0.85;
      line-height: 1.5;
    }
    #overlay.hidden {
      display: none;
    }
    .hint {
      margin-top: 1rem;
      font-size: clamp(0.8rem, 3vw, 0.9rem);
      opacity: 0.6;
    }
    /* Touch controls */
    #touch-controls {
      display: none;
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      width: 100%;
      height: 90px;
      pointer-events: none;
      z-index: 20;
      padding: 0 16px;
      box-sizing: border-box;
    }
    #touch-controls.visible {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }
    .touch-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: rgba(100, 140, 255, 0.22);
      border: 2px solid rgba(140, 180, 255, 0.55);
      color: #cde;
      font-size: 1.6rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 0 18px rgba(80, 120, 255, 0.25);
      transition: background 0.08s, transform 0.08s;
    }
    .touch-btn:active,
    .touch-btn.active {
      background: rgba(120, 170, 255, 0.45);
      transform: scale(0.94);
    }
    #btn-shoot {
      width: 78px;
      height: 78px;
      background: rgba(255, 100, 120, 0.22);
      border-color: rgba(255, 140, 160, 0.55);
      box-shadow: 0 0 18px rgba(255, 80, 100, 0.25);
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }
    #btn-shoot:active,
    #btn-shoot.active {
      background: rgba(255, 120, 140, 0.5);
    }
    .move-group {
      display: flex;
      gap: 14px;
      pointer-events: auto;
    }
    @media (max-width: 420px) {
      .touch-btn {
        width: 62px;
        height: 62px;
        font-size: 1.4rem;
      }
      #btn-shoot {
        width: 70px;
        height: 70px;
      }
    }
  </style>
</head>
<body>
  <h1>✦ Space Shooter</h1>
  <div id="ui">
    <div>Score: <span id="score">0</span></div>
    <div>Lives: <span id="lives">3</span></div>
    <div>Level: <span id="level">1</span></div>
  </div>
  <div id="game-wrap">
    <canvas id="c" width="480" height="640"></canvas>
    <div id="overlay">
      <h2>SPACE SHOOTER</h2>
      <p id="controls-text">Arrow keys / A D to move<br>Space / W to shoot</p>
      <p class="hint" id="start-hint">Press Space or Enter to start</p>
    </div>
    <div id="touch-controls">
      <div class="move-group">
        <div class="touch-btn" id="btn-left" aria-label="Move left">◀</div>
        <div class="touch-btn" id="btn-right" aria-label="Move right">▶</div>
      </div>
      <div class="touch-btn" id="btn-shoot" aria-label="Shoot">FIRE</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("c");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const livesEl = document.getElementById("lives");
    const levelEl = document.getElementById("level");
    const overlay = document.getElementById("overlay");
    const touchControls = document.getElementById("touch-controls");
    const btnLeft = document.getElementById("btn-left");
    const btnRight = document.getElementById("btn-right");
    const btnShoot = document.getElementById("btn-shoot");
    const controlsText = document.getElementById("controls-text");
    const startHint = document.getElementById("start-hint");

    const BASE_W = 480;
    const BASE_H = 640;
    let W = BASE_W;
    let H = BASE_H;

    // Detect touch / coarse pointer
    const isTouch = ("ontouchstart" in window) ||
      (navigator.maxTouchPoints > 0) ||
      window.matchMedia("(pointer: coarse)").matches;

    if (isTouch) {
      touchControls.classList.add("visible");
      controlsText.innerHTML = "Use on-screen buttons<br>or drag to move · auto-fire";
      startHint.textContent = "Tap anywhere to start";
    }

    // Game state
    let state = "title"; // title | playing | gameover
    let score = 0;
    let lives = 3;
    let level = 1;
    let frame = 0;
    let spawnTimer = 0;
    let stars = [];
    let particles = [];

    // Input
    const keys = {};
    const touch = { left: false, right: false, shoot: false, dragging: false };

    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;
      if (e.code === "Space" || e.code === "Enter") {
        e.preventDefault();
        if (state === "title" || state === "gameover") startGame();
      }
    });
    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    // Touch button helpers
    function bindButton(el, key) {
      const on = (e) => {
        e.preventDefault();
        e.stopPropagation();
        touch[key] = true;
        el.classList.add("active");
        if ((key === "shoot" || true) && (state === "title" || state === "gameover")) {
          startGame();
        }
      };
      const off = (e) => {
        e.preventDefault();
        e.stopPropagation();
        touch[key] = false;
        el.classList.remove("active");
      };
      el.addEventListener("touchstart", on, { passive: false });
      el.addEventListener("touchend", off, { passive: false });
      el.addEventListener("touchcancel", off, { passive: false });
      el.addEventListener("mousedown", on);
      el.addEventListener("mouseup", off);
      el.addEventListener("mouseleave", off);
    }
    bindButton(btnLeft, "left");
    bindButton(btnRight, "right");
    bindButton(btnShoot, "shoot");

    // Canvas touch: drag to move + start game
    function canvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY,
      };
    }

    function onPointerDown(e) {
      e.preventDefault();
      if (state === "title" || state === "gameover") {
        startGame();
        return;
      }
      touch.dragging = true;
      const pos = canvasCoords(e);
      player.x = Math.max(player.w / 2 + 4, Math.min(W - player.w / 2 - 4, pos.x));
    }
    function onPointerMove(e) {
      if (!touch.dragging || state !== "playing") return;
      e.preventDefault();
      const pos = canvasCoords(e);
      player.x = Math.max(player.w / 2 + 4, Math.min(W - player.w / 2 - 4, pos.x));
    }
    function onPointerUp(e) {
      touch.dragging = false;
    }

    canvas.addEventListener("touchstart", onPointerDown, { passive: false });
    canvas.addEventListener("touchmove", onPointerMove, { passive: false });
    canvas.addEventListener("touchend", onPointerUp, { passive: false });
    canvas.addEventListener("mousedown", onPointerDown);
    canvas.addEventListener("mousemove", onPointerMove);
    canvas.addEventListener("mouseup", onPointerUp);
    canvas.addEventListener("mouseleave", onPointerUp);

    // Prevent page scroll / bounce on iOS
    document.addEventListener("touchmove", (e) => {
      if (e.target === canvas || e.target.closest("#touch-controls")) {
        e.preventDefault();
      }
    }, { passive: false });

    // Player
    const player = {
      x: W / 2,
      y: H - 60,
      w: 36,
      h: 28,
      speed: 5.5,
      cooldown: 0,
      invuln: 0,
    };

    let bullets = [];
    let enemies = [];
    let enemyBullets = [];

    function startGame() {
      state = "playing";
      score = 0;
      lives = 3;
      level = 1;
      frame = 0;
      spawnTimer = 0;
      bullets = [];
      enemies = [];
      enemyBullets = [];
      particles = [];
      player.x = W / 2;
      player.y = H - 60;
      player.cooldown = 0;
      player.invuln = 0;
      overlay.classList.add("hidden");
      updateUI();
    }

    function updateUI() {
      scoreEl.textContent = score;
      livesEl.textContent = lives;
      levelEl.textContent = level;
    }

    // Stars background
    function initStars() {
      stars = [];
      for (let i = 0; i < 80; i++) {
        stars.push({
          x: Math.random() * W,
          y: Math.random() * H,
          s: Math.random() * 1.8 + 0.4,
          speed: Math.random() * 1.2 + 0.3,
        });
      }
    }
    initStars();

    function spawnEnemy() {
      const type = Math.random() < 0.15 + level * 0.02 ? "fast" : "normal";
      const size = type === "fast" ? 22 : 30;
      enemies.push({
        x: 30 + Math.random() * (W - 60),
        y: -40,
        w: size,
        h: size,
        vx: (Math.random() - 0.5) * (1.2 + level * 0.15),
        vy: type === "fast" ? 2.8 + level * 0.25 : 1.4 + level * 0.18,
        hp: type === "fast" ? 1 : 1 + Math.floor(level / 3),
        type,
        shootCooldown: 40 + Math.random() * 80,
      });
    }

    function spawnParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3.5 + 1;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 30 + Math.random() * 25,
          maxLife: 55,
          color,
          size: Math.random() * 3 + 1.5,
        });
      }
    }

    function rectsOverlap(a, b) {
      return (
        a.x - a.w / 2 < b.x + b.w / 2 &&
        a.x + a.w / 2 > b.x - b.w / 2 &&
        a.y - a.h / 2 < b.y + b.h / 2 &&
        a.y + a.h / 2 > b.y - b.h / 2
      );
    }

    function update() {
      frame++;

      // Stars
      for (const s of stars) {
        s.y += s.speed;
        if (s.y > H) {
          s.y = 0;
          s.x = Math.random() * W;
        }
      }

      // Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.96;
        p.vy *= 0.96;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      if (state !== "playing") return;

      // Player movement (keyboard + touch buttons)
      if (keys["ArrowLeft"] || keys["KeyA"] || touch.left) player.x -= player.speed;
      if (keys["ArrowRight"] || keys["KeyD"] || touch.right) player.x += player.speed;
      player.x = Math.max(player.w / 2 + 4, Math.min(W - player.w / 2 - 4, player.x));

      if (player.cooldown > 0) player.cooldown--;
      if (player.invuln > 0) player.invuln--;

      // Shoot (keyboard, touch button, or auto-fire while dragging on mobile)
      const wantShoot =
        keys["Space"] ||
        keys["KeyW"] ||
        keys["ArrowUp"] ||
        touch.shoot ||
        (isTouch && touch.dragging);

      if (wantShoot && player.cooldown <= 0) {
        bullets.push({
          x: player.x,
          y: player.y - player.h / 2,
          w: 4,
          h: 12,
          vy: -9,
        });
        // dual shot at higher levels
        if (level >= 3) {
          bullets.push({
            x: player.x - 12,
            y: player.y - player.h / 2 + 4,
            w: 3,
            h: 10,
            vy: -8.5,
          });
          bullets.push({
            x: player.x + 12,
            y: player.y - player.h / 2 + 4,
            w: 3,
            h: 10,
            vy: -8.5,
          });
        }
        player.cooldown = level >= 5 ? 8 : 12;
      }

      // Bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.y += b.vy;
        if (b.y < -20) bullets.splice(i, 1);
      }

      // Enemy bullets
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        b.y += b.vy;
        b.x += b.vx || 0;
        if (b.y > H + 20) enemyBullets.splice(i, 1);
      }

      // Spawn enemies
      spawnTimer--;
      const spawnRate = Math.max(18, 55 - level * 3);
      if (spawnTimer <= 0) {
        spawnEnemy();
        spawnTimer = spawnRate + Math.random() * 15;
      }

      // Enemies
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        e.x += e.vx;
        e.y += e.vy;
        if (e.x < e.w / 2 || e.x > W - e.w / 2) e.vx *= -1;

        e.shootCooldown--;
        if (e.shootCooldown <= 0 && e.y > 20 && e.y < H * 0.6) {
          enemyBullets.push({
            x: e.x,
            y: e.y + e.h / 2,
            w: 5,
            h: 8,
            vy: 4 + level * 0.3,
            vx: (player.x - e.x) * 0.012,
          });
          e.shootCooldown = 70 - Math.min(level * 4, 40) + Math.random() * 40;
        }

        // Collision with player bullets
        for (let j = bullets.length - 1; j >= 0; j--) {
          const b = bullets[j];
          if (rectsOverlap(e, b)) {
            bullets.splice(j, 1);
            e.hp--;
            spawnParticles(b.x, b.y, "#8cf", 5);
            if (e.hp <= 0) {
              score += e.type === "fast" ? 150 : 100;
              if (score > 0 && score % 1000 < 150) {
                level = Math.min(15, Math.floor(score / 1000) + 1);
              }
              spawnParticles(e.x, e.y, e.type === "fast" ? "#f85" : "#f5a", 14);
              enemies.splice(i, 1);
              updateUI();
              break;
            }
          }
        }

        // Enemy hits player
        if (player.invuln <= 0 && rectsOverlap(e, player)) {
          lives--;
          player.invuln = 90;
          spawnParticles(player.x, player.y, "#f66", 18);
          enemies.splice(i, 1);
          updateUI();
          if (lives <= 0) {
            state = "gameover";
            overlay.classList.remove("hidden");
            const restartMsg = isTouch ? "Tap to restart" : "Press Space or Enter to restart";
            overlay.innerHTML = `
              <h2>GAME OVER</h2>
              <p>Score: ${score}</p>
              <p class="hint">${restartMsg}</p>
            `;
          }
        }

        // Off screen
        if (e.y > H + 50) enemies.splice(i, 1);
      }

      // Enemy bullets hit player
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const b = enemyBullets[i];
        if (player.invuln <= 0 && rectsOverlap(b, player)) {
          enemyBullets.splice(i, 1);
          lives--;
          player.invuln = 90;
          spawnParticles(player.x, player.y, "#f66", 16);
          updateUI();
          if (lives <= 0) {
            state = "gameover";
            overlay.classList.remove("hidden");
            const restartMsg = isTouch ? "Tap to restart" : "Press Space or Enter to restart";
            overlay.innerHTML = `
              <h2>GAME OVER</h2>
              <p>Score: ${score}</p>
              <p class="hint">${restartMsg}</p>
            `;
          }
        }
      }

      // Level up check (extra)
      const newLevel = Math.min(15, Math.floor(score / 1000) + 1);
      if (newLevel > level) {
        level = newLevel;
        updateUI();
      }
    }

    function drawShip(x, y, w, h, color, invuln = false) {
      ctx.save();
      if (invuln && Math.floor(frame / 4) % 2 === 0) {
        ctx.globalAlpha = 0.35;
      }
      // Body
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(x, y - h / 2);
      ctx.lineTo(x - w / 2, y + h / 2);
      ctx.lineTo(x - w / 5, y + h / 3);
      ctx.lineTo(x + w / 5, y + h / 3);
      ctx.lineTo(x + w / 2, y + h / 2);
      ctx.closePath();
      ctx.fill();

      // Cockpit
      ctx.fillStyle = "#aef";
      ctx.beginPath();
      ctx.moveTo(x, y - h / 4);
      ctx.lineTo(x - 6, y + 4);
      ctx.lineTo(x + 6, y + 4);
      ctx.closePath();
      ctx.fill();

      // Engine glow
      if (!invuln || Math.floor(frame / 3) % 2) {
        ctx.fillStyle = "#fa4";
        ctx.beginPath();
        ctx.moveTo(x - 5, y + h / 3);
        ctx.lineTo(x, y + h / 2 + 8 + Math.sin(frame * 0.4) * 3);
        ctx.lineTo(x + 5, y + h / 3);
        ctx.fill();
      }
      ctx.restore();
    }

    function drawEnemy(e) {
      ctx.save();
      const c = e.type === "fast" ? "#f64" : "#c5f";
      ctx.fillStyle = c;
      // Hex-ish body
      ctx.beginPath();
      const r = e.w / 2;
      for (let i = 0; i < 6; i++) {
        const a = (Math.PI / 3) * i - Math.PI / 6;
        const px = e.x + Math.cos(a) * r;
        const py = e.y + Math.sin(a) * r * 0.85;
        if (i === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();

      // Core
      ctx.fillStyle = "#210";
      ctx.beginPath();
      ctx.arc(e.x, e.y, r * 0.35, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = "#f88";
      ctx.beginPath();
      ctx.arc(e.x, e.y + 2, 3, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function draw() {
      // Clear with slight trail
      ctx.fillStyle = "rgba(5, 5, 8, 0.35)";
      ctx.fillRect(0, 0, W, H);

      // Stars
      for (const s of stars) {
        ctx.fillStyle = `rgba(200, 210, 255, ${0.3 + s.s * 0.35})`;
        ctx.fillRect(s.x, s.y, s.s, s.s);
      }

      // Particles
      for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      if (state === "playing" || state === "gameover") {
        // Player
        drawShip(player.x, player.y, player.w, player.h, "#6af", player.invuln > 0);

        // Player bullets
        ctx.fillStyle = "#8ef";
        for (const b of bullets) {
          ctx.shadowColor = "#4af";
          ctx.shadowBlur = 8;
          ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
        }
        ctx.shadowBlur = 0;

        // Enemies
        for (const e of enemies) drawEnemy(e);

        // Enemy bullets
        ctx.fillStyle = "#f55";
        for (const b of enemyBullets) {
          ctx.beginPath();
          ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // Responsive canvas sizing for mobile
    function resizeCanvas() {
      const wrap = document.getElementById("game-wrap");
      const maxW = Math.min(BASE_W, window.innerWidth - 16);
      // Leave room for UI + touch controls
      const availableH = window.innerHeight - (isTouch ? 200 : 120);
      const maxH = Math.min(BASE_H, availableH);
      const scale = Math.min(maxW / BASE_W, maxH / BASE_H, 1);
      const displayW = Math.floor(BASE_W * scale);
      const displayH = Math.floor(BASE_H * scale);
      canvas.style.width = displayW + "px";
      canvas.style.height = displayH + "px";
    }
    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("orientationchange", () => setTimeout(resizeCanvas, 100));
    resizeCanvas();

    loop();
  </script>
</body>
</html>
