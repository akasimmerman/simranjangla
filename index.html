<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coaster Coin Run</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#140f36;
    --sky-mid:#4a2a6e;
    --sky-horizon:#ff8c42;
    --sky-glow:#ffd66b;
    --hill-far:#2a1b4d;
    --hill-near:#1c1238;
    --wood:#3b2a20;
    --wood-light:#6b4a30;
    --rail:#cfa15c;
    --cart-body:#e8552e;
    --cart-trim:#f7ecd9;
    --coin-gold:#ffd23f;
    --coin-shadow:#b8860b;
    --cream:#f7ecd9;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--sky-top);
    font-family:'Kanit', sans-serif;
  }
  #stage{ position:relative; width:100vw; height:100vh; }
  canvas{ display:block; width:100%; height:100%; }

  .marquee{
    position:absolute; top:18px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:14px;
    padding:10px 26px;
    background:linear-gradient(180deg, #2a1b4d, #1c1238);
    border:3px solid var(--rail);
    border-radius:14px;
    box-shadow:0 6px 0 rgba(0,0,0,0.35), 0 0 24px rgba(255,210,63,0.25);
  }
  .marquee .bulbs{
    position:absolute; inset:-9px;
    border-radius:18px;
    pointer-events:none;
  }
  .marquee .bulbs span{
    position:absolute; width:8px; height:8px; border-radius:50%;
    animation:twinkle 1.4s infinite ease-in-out;
    box-shadow:0 0 6px currentColor;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.3; }
    50%{ opacity:1; }
  }
  .title{
    font-family:'Bungee', cursive;
    color:var(--coin-gold);
    font-size:15px;
    letter-spacing:2px;
    text-shadow:2px 2px 0 #7a3b0a;
    white-space:nowrap;
  }
  .score-box{
    font-family:'Bungee', cursive;
    color:var(--cream);
    font-size:22px;
    letter-spacing:1px;
    display:flex; align-items:center; gap:8px;
    min-width:90px;
  }
  .coin-icon{
    width:20px; height:20px;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:18px; line-height:1;
  }
  .hint{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    color:var(--cream); opacity:0.65; font-size:12px; letter-spacing:1px;
    font-family:'Kanit', sans-serif;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div class="marquee">
    <div class="bulbs" id="bulbs"></div>
    <div class="title">COASTER&nbsp;COIN&nbsp;RUN</div>
    <div class="score-box"><span class="coin-icon">💩</span><span id="scoreVal">0</span></div>
  </div>
  <div class="hint">sit back — the cart collects the coins on its own</div>
</div>

<script>
// ---------- setup ----------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('scoreVal');
let W, H, DPR;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// marquee bulbs
const bulbColors = ['#ff5e7e','#ffd23f','#5ec8ff'];
const bulbsWrap = document.getElementById('bulbs');
const bulbCount = 22;
for(let i=0;i<bulbCount;i++){
  const b = document.createElement('span');
  const t = i/(bulbCount-1);
  const angle = Math.PI * t; // arc across top only, simple ring approximation
  b.style.left = (t*100)+'%';
  b.style.top = (i%2===0? '0%':'100%');
  b.style.color = bulbColors[i%bulbColors.length];
  b.style.background = bulbColors[i%bulbColors.length];
  b.style.animationDelay = (i*0.09)+'s';
  bulbsWrap.appendChild(b);
}

// ---------- world / track ----------
const baseY = () => H*0.58;
const A1 = 70, F1 = 0.010, A2 = 28, F2 = 0.027, PH2 = 1.3;

function trackY(x){
  return baseY() + A1*Math.sin(x*F1) + A2*Math.sin(x*F2 + PH2);
}
function trackSlope(x){
  const dx = 2;
  return (trackY(x+dx) - trackY(x-dx)) / (2*dx);
}

let cameraX = 0;
let baseSpeed = 140; // px/s along world x
let score = 0;

const cartScreenX = () => W*0.28;

// ---------- coins ----------
let coins = [];
let nextCoinSpawnX = 200;

function spawnCoinsUpTo(worldXLimit){
  while(nextCoinSpawnX < worldXLimit){
    // small clusters of 3-5 coins following the track curve
    const clusterSize = 3 + Math.floor(Math.random()*3);
    const spacing = 34;
    for(let i=0;i<clusterSize;i++){
      const wx = nextCoinSpawnX + i*spacing;
      coins.push({ x: wx, collected:false, bob: Math.random()*Math.PI*2, spin:0 });
    }
    nextCoinSpawnX += clusterSize*spacing + 180 + Math.random()*220;
  }
}

// ---------- particles (on collect) ----------
let particles = [];
function burst(x,y){
  for(let i=0;i<10;i++){
    const ang = Math.random()*Math.PI*2;
    const spd = 60 + Math.random()*90;
    particles.push({
      x,y, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd - 40,
      life:0.6, maxLife:0.6
    });
  }
}

// ---------- background layers (parallax) ----------
function drawSky(){
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#140f36');
  grad.addColorStop(0.45, '#4a2a6e');
  grad.addColorStop(0.75, '#ff8c42');
  grad.addColorStop(1, '#ffd66b');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  // sun
  ctx.beginPath();
  ctx.arc(W*0.78, H*0.55, 55, 0, Math.PI*2);
  const sunGrad = ctx.createRadialGradient(W*0.78,H*0.55,0,W*0.78,H*0.55,55);
  sunGrad.addColorStop(0,'rgba(255,246,214,0.95)');
  sunGrad.addColorStop(1,'rgba(255,214,107,0)');
  ctx.fillStyle = sunGrad;
  ctx.fill();

  // stars (only upper sky)
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for(let i=0;i<40;i++){
    const sx = (i*137.5 + cameraX*0.02) % W;
    const sy = (i*57.3) % (H*0.35);
    ctx.globalAlpha = 0.3 + 0.5*Math.abs(Math.sin(i*3+cameraX*0.001));
    ctx.fillRect(sx, sy, 2, 2);
  }
  ctx.globalAlpha = 1;
}

function drawHills(){
  drawHillLayer(0.15, H*0.62, 90, '#2a1b4d');
  drawHillLayer(0.32, H*0.68, 60, '#1c1238');
}
function drawHillLayer(parallax, baseline, amp, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(0,H);
  const offset = cameraX*parallax;
  for(let sx=0; sx<=W; sx+=20){
    const wx = sx + offset;
    const y = baseline - amp*Math.sin(wx*0.004) - amp*0.4*Math.sin(wx*0.011+2);
    ctx.lineTo(sx,y);
  }
  ctx.lineTo(W,H);
  ctx.closePath();
  ctx.fill();
}

// ---------- track & supports ----------
function drawTrack(){
  // support beams
  ctx.strokeStyle = 'var(--wood)';
  ctx.strokeStyle = '#3b2a20';
  ctx.lineWidth = 6;
  for(let sx=0; sx<W; sx+=46){
    const wx = sx + cameraX;
    const ty = trackY(wx);
    ctx.beginPath();
    ctx.moveTo(sx, ty+6);
    ctx.lineTo(sx, H*0.86);
    ctx.stroke();
    // cross brace
    ctx.beginPath();
    ctx.moveTo(sx, ty + (H*0.86-ty)*0.4);
    ctx.lineTo(sx+46, trackY(wx+46) + (H*0.86-trackY(wx+46))*0.6);
    ctx.strokeStyle = '#6b4a30';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.strokeStyle = '#3b2a20';
    ctx.lineWidth = 6;
  }

  // rail path
  ctx.beginPath();
  for(let sx=0; sx<=W; sx+=8){
    const wx = sx + cameraX;
    const y = trackY(wx);
    if(sx===0) ctx.moveTo(sx,y); else ctx.lineTo(sx,y);
  }
  ctx.lineWidth = 10;
  ctx.strokeStyle = '#2a1c14';
  ctx.stroke();

  ctx.beginPath();
  for(let sx=0; sx<=W; sx+=8){
    const wx = sx + cameraX;
    const y = trackY(wx) - 5;
    if(sx===0) ctx.moveTo(sx,y); else ctx.lineTo(sx,y);
  }
  ctx.lineWidth = 4;
  ctx.strokeStyle = '#cfa15c';
  ctx.stroke();
}

// ---------- coins drawing ----------
function drawCoins(t){
  ctx.font = '26px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for(const c of coins){
    if(c.collected) continue;
    const sx = c.x - cameraX;
    if(sx < -40 || sx > W+40) continue;
    const y = trackY(c.x) - 34 + Math.sin(t*3 + c.bob)*5;
    const squash = Math.abs(Math.cos(t*2.2 + c.bob*2));
    ctx.save();
    ctx.translate(sx,y);
    ctx.scale(Math.max(0.4,squash), 1);
    ctx.fillText('💩', 0, 0);
    ctx.restore();
  }
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

// ---------- cart & rider ----------
function drawCart(t, worldX){
  const sx = cartScreenX();
  const y = trackY(worldX);
  const slope = trackSlope(worldX);
  const angle = Math.atan2(slope, 1);
  const bob = Math.sin(t*10)*1.5;

  ctx.save();
  ctx.translate(sx, y - 22 + bob);
  ctx.rotate(angle);

  // wheels
  ctx.fillStyle = '#221812';
  ctx.beginPath(); ctx.arc(-16,20,7,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(16,20,7,0,Math.PI*2); ctx.fill();

  // cart body
  ctx.fillStyle = '#e8552e';
  roundRect(ctx,-24,-4,48,24,8);
  ctx.fill();
  ctx.fillStyle = '#f7ecd9';
  roundRect(ctx,-24,-4,48,8,6);
  ctx.fill();

  // rider (simple silhouette, arms up)
  ctx.strokeStyle = '#1c1238';
  ctx.fillStyle = '#1c1238';
  ctx.lineWidth = 5;
  ctx.lineCap = 'round';
  // body
  ctx.beginPath();
  ctx.moveTo(0,-6);
  ctx.lineTo(0,-26);
  ctx.stroke();
  // head
  ctx.beginPath();
  ctx.arc(0,-34,8,0,Math.PI*2);
  ctx.fill();
  // arms up (cheering)
  ctx.beginPath();
  ctx.moveTo(0,-24);
  ctx.lineTo(-14,-40);
  ctx.moveTo(0,-24);
  ctx.lineTo(14,-40);
  ctx.stroke();

  // name label (kept upright regardless of cart tilt)
  ctx.rotate(-angle);
  ctx.font = "600 13px 'Kanit', sans-serif";
  ctx.textAlign = 'center';
  ctx.fillStyle = '#1c1238';
  ctx.strokeStyle = '#f7ecd9';
  ctx.lineWidth = 3;
  ctx.strokeText('Ayaan', 0, -50);
  ctx.fillText('Ayaan', 0, -50);
  ctx.textAlign = 'start';

  ctx.restore();
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ---------- particles ----------
function updateAndDrawParticles(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p = particles[i];
    p.life -= dt;
    if(p.life<=0){ particles.splice(i,1); continue; }
    p.vy += 160*dt;
    p.x += p.vx*dt;
    p.y += p.vy*dt;
    const a = p.life/p.maxLife;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath();
    ctx.arc(p.x - cameraX, p.y, 3*a+1, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ---------- main loop ----------
let lastTime = null;
function frame(now){
  if(lastTime===null) lastTime = now;
  const dt = Math.min((now-lastTime)/1000, 0.05);
  lastTime = now;
  const t = now/1000;

  const cartWorldX = cameraX + cartScreenX();
  const slope = trackSlope(cartWorldX);
  const speed = baseSpeed * (1 - Math.max(-0.6,Math.min(0.6, slope*0.8)) );
  cameraX += speed*dt;

  spawnCoinsUpTo(cameraX + W + 300);
  coins = coins.filter(c => c.x > cameraX - 200);

  for(const c of coins){
    if(c.collected) continue;
    if(Math.abs(c.x - cartWorldX) < 22){
      c.collected = true;
      score++;
      scoreEl.textContent = score;
      burst(c.x, trackY(c.x)-34);
    }
  }

  ctx.clearRect(0,0,W,H);
  drawSky();
  drawHills();
  drawTrack();
  drawCoins(t);
  updateAndDrawParticles(dt);
  drawCart(t, cartWorldX);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
